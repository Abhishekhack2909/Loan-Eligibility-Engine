services:
  llm-stub:
    image: python:3.12-slim
    command: ["python", "/app/server.py"]
    environment:
      LLM_STUB_PORT: "8090"
    volumes:
      - ./llm_stub:/app:ro
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.67.1
    entrypoint: ["tini", "--"]
    command: ["node", "/data/n8n-bootstrap.js"]
    env_file:
      - .env
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_USER_MANAGEMENT_DISABLED: "true"
      N8N_PROVISION_MARKER: /home/node/.n8n/.loan-engine-provisioned-aws-v1
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/data/workflows:ro
      - ./n8n-bootstrap.js:/data/n8n-bootstrap.js:ro
    depends_on:
      llm-stub:
        condition: service_started
    ports:
      - "5678:5678"
    restart: unless-stopped

volumes:
  n8n-data:
